name: Publish Cats House
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Import compiled build when provided
        run: |
          if [ -f build.zip ]; then
            unzip -o build.zip
            git rm build.zip
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html game.min.js style.css assets vendor README.md .nojekyll
            git commit -m 'Expand compiled Cats House build'
            git push
          fi
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html game.min.js style.css .nojekyll _site/
          cp -r assets vendor _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
